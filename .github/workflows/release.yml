name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Check the version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "Invalid version: $version"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=${GITHUB_REF_NAME#v}
            [[ "$tag" == "$version" ]] || { echo "Tag $tag does not match pubspec $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tag is not on main"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/check_imports.dart
      - run: flutter analyze
      - run: flutter test ci_test

  # Flutter publishes only an x64 Windows SDK, so there is no native arm64 build to make here.
  # Windows on ARM runs this x64 build through the system's x64 emulation.
  windows:
    needs: [prepare, analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        env:
          SSHAIRY_BUILD_STAMP: ''
        run: ./tool/package_windows.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: [prepare, analyze]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Package
        env:
          SSHAIRY_BUILD_STAMP: ''
        run: |
          chmod +x tool/package_unix.sh
          ./tool/package_unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # Flutter publishes only an x64 Linux SDK and refuses x64-to-arm64 cross-builds.
  # An arm64 package needs a Flutter SDK running natively on arm64, which does not exist upstream.
  linux:
    needs: [prepare, analyze]
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Prepare container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates clang cmake curl file git ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev liblzma-dev libstdc++-12-dev \
            jq unzip xz-utils zip
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool
          cd /opt && /usr/local/bin/appimagetool --appimage-extract
          ln -sf /opt/squashfs-root/AppRun /usr/local/bin/appimagetool
      - run: flutter pub get
      - name: Package
        env:
          SSHAIRY_BUILD_STAMP: ''
        run: |
          chmod +x tool/package_unix.sh
          ./tool/package_unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  android:
    needs: [prepare, analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Build split APKs
        # Let the release build run pub get so Flutter excludes test-only plugins from the registrant.
        # Flutter adds an ABI offset to the base version code. Keep the base above the v0.3.0 build (2008).
        run: flutter build apk --release --split-per-abi --build-number "$((2008 + GITHUB_RUN_NUMBER))"
      - name: Package and verify APKs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          keystore=''
          if [[ "$GITHUB_REF_TYPE" == tag || -n "$ANDROID_PREVIEW_KEYSTORE_BASE64" ]]; then
            : "${ANDROID_PREVIEW_KEYSTORE_BASE64:?Configure the Actions secret for the Android preview signing key}"
            keystore=$(mktemp "$RUNNER_TEMP/sshairy-keystore.XXXXXX")
            trap 'rm -f -- "$keystore"' EXIT
            printf '%s' "$ANDROID_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            source="build/app/outputs/flutter-apk/app-$abi-release.apk"
            apk="dist/sshairy-$VERSION-android-$abi.apk"
            if [[ -n "$keystore" ]]; then
              # Reuse the original preview certificate so Android accepts updates over v0.3.0.
              "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias androiddebugkey \
                --ks-pass pass:android --key-pass pass:android --out "$apk" "$source"
            else
              cp -- "$source" "$apk"
            fi
            certificate=$("$build_tools/apksigner" verify --print-certs "$apk")
            if [[ -n "$keystore" ]]; then
              grep -Fx 'Signer #1 certificate SHA-256 digest: e2420999243e854a32576e0596f195d58ac67cbb86d2160695446cf13d5db2f9' <<< "$certificate"
            fi
            metadata=$("$build_tools/aapt" dump badging "$apk")
            grep -Fx "native-code: '$abi'" <<< "$metadata"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, windows, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          notes=(--generate-notes)
          if [[ -f CHANGELOG.md && "$(sed -n '1p' CHANGELOG.md)" == "# Sshairy $VERSION" ]]; then
            notes=(--notes-file CHANGELOG.md)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --title "Sshairy $VERSION" "${notes[@]}"

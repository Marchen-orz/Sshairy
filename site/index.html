<!doctype html>
<!-- Static landing page: no build step, deployable as-is (e.g. Vercel or GitHub Pages with /site as the root).
     Copy lives in site.js (en, zh); numbers in assets/data.js; drawn interface panels in mock.js. -->
<html lang="en" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sshairy · Lightweight SSH. Powered by AI.</title>
<meta name="description" content="Sshairy is a lightweight, native SSH client for Windows, macOS, Linux and Android: terminals, SFTP, tunnels, server monitoring, AI in the terminal and a phone link, with no browser engine.">
<meta property="og:title" content="Sshairy · Lightweight SSH. Powered by AI.">
<meta property="og:description" content="Terminals, SFTP, tunnels, monitoring and AI in one native window, with your phone linked in.">
<meta property="og:image" content="https://sshairy.marchen.top/media/poster-en.jpg">
<meta name="theme-color" content="#F1F7FF">
<script>try{document.documentElement.dataset.scheme=localStorage.getItem('scheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="#top"><img data-brand="wordmark" alt="Sshairy"></a>
  <nav>
    <a href="#tour" data-i="nTour"></a>
    <a href="#airy">Airy</a>
    <a href="#link" data-i="nLink"></a>
    <a href="cases.html" data-i="nCases"></a>
    <a href="#performance" data-i="nPerf"></a>
    <a href="#docs" data-i="nDocs"></a>
  </nav>
  <div class="dots" id="dots" role="group"></div>
  <button class="lang" id="lang" type="button"></button>
  <button class="lang" id="scheme" type="button"><svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg><svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <a class="gh" data-href="" aria-label="GitHub"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg></a>
  <a class="btn" href="#download" data-i="nGet"></a>
</header>

<main id="top">
<section class="hero" data-pose="default">
  <div class="air"></div>
  <div class="wrap">
    <img class="mascot" data-brand="default" alt="">
    <h1><span data-i="h1a">Lightweight SSH.</span><br><span class="k-grad" data-i="h1b">Powered by AI.</span></h1>
    <p class="lede" data-i="lede">Terminals, SFTP, tunnels and server monitoring in one clean native window.</p>
    <div class="cta">
      <a class="btn big" id="dl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span id="dlLabel"></span></a>
      <a class="btn big ghost" id="dlAndroid"></a>
      <a class="btn big ghost" data-href="" data-i="src"></a>
    </div>
    <p class="fine" id="fine"></p>
  </div>
  <div class="wrap stats" id="stats"></div>
</section>

<section class="band" id="tour" data-pose="coding-focus">
  <div class="wrap">
    <h2 class="rv" data-i="tourH"></h2>
    <div class="tabs rv" id="tabs" role="tablist"></div>
    <div class="shot rv"><div class="k-win" id="tourWin"></div></div>
    <div class="grid6 stg" id="feats"></div>
  </div>
</section>

<section class="band mint" id="airy" data-pose="thinking-ai">
  <div class="wrap two">
    <div>
      <h2 class="rv" data-i="airyH"></h2>
      <p class="lede rv" data-i="airyP"></p>
      <ul class="ways rv" id="ways"></ul>
      <div class="seg rv" id="modes" role="group"></div>
      <p class="hint rv" id="modeHint" aria-live="polite"></p>
    </div>
    <div class="chat rv">
      <img class="mascot" id="airyMascot" data-brand="thinking-ai" alt="">
      <div class="float"><div class="sa-part" id="chat"></div></div>
      <button class="replay" id="replay" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.2-5.1M19 5v4h-4"/></svg></button>
    </div>
  </div>
</section>

<section class="band" id="link" data-pose="ssh-connected">
  <div class="wrap two">
    <div>
      <h2 class="rv" data-i="linkH"></h2>
      <p class="lede rv" data-i="linkP"></p>
    </div>
    <div class="phones rv" id="phones"></div>
  </div>
</section>

<section class="band wash" id="cases" data-pose="coding-focus">
  <div class="wrap">
    <div class="head rv"><h2 data-i="casesH"></h2><a class="btn" href="cases.html" data-i="casesAll"></a></div>
    <div class="cases-grid stg" id="caseCards"></div>
  </div>
</section>

<section class="band" id="themes" data-pose="happy">
  <div class="wrap">
    <div class="head rv"><h2 data-i="themesH"></h2><div class="seg" id="mode" role="group"></div></div>
    <div class="pals stg" id="pals"></div>
    <div class="shot rv"><div class="k-win" id="themeWin"></div></div>
  </div>
</section>

<section class="band wash" id="performance" data-pose="speed">
  <div class="wrap">
    <h2 class="rv" data-i="perfH"></h2>
    <p class="lede rv" data-i="perfP"></p>
    <div class="duo">
      <div class="panel rv"><div class="num"><b><span data-n="0.62">0.62</span><small data-i="sec"></small></b><span data-i="startup"></span></div><div class="k-bars live" data-chart="startup" data-unit="s" data-digits="2"></div></div>
      <div class="panel rv"><div class="num"><b><span data-n="131">131</span><small>MiB</small></b><span data-i="memory"></span></div><div class="k-bars live" data-chart="memory" data-unit="MiB" data-digits="1"></div></div>
      <div class="panel rv"><div class="num"><b><span data-n="27">27</span><small>MiB</small></b><span data-i="download"></span></div><div class="k-bars live" data-chart="download" data-unit="MiB" data-digits="1"></div></div>
      <div class="panel rv"><div class="num"><b><span data-n="97.4">97.4</span><small>MiB</small></b><span data-i="unpacked"></span></div><div class="k-stack" id="stack"></div><div class="parts" id="parts"></div><div class="pills" id="pills"></div></div>
    </div>
    <details class="all rv"><summary data-i="tableS"></summary><div id="table"></div></details>
  </div>
</section>

<section class="band" id="film" data-pose="success">
  <div class="wrap">
    <h2 class="rv" data-i="filmH"></h2>
    <div class="video rv"><video id="video" controls preload="none" playsinline></video></div>
  </div>
</section>

<section class="band mint" id="download" data-pose="sftp-transfer">
  <div class="wrap">
    <h2 class="rv" data-i="getH"></h2>
    <div class="os4 stg" id="osCards"></div>
    <div class="code rv" id="build"><button id="copy" type="button"></button><pre><code id="steps"></code></pre></div>
  </div>
</section>

<section class="band" id="docs" data-pose="security">
  <div class="wrap">
    <h2 class="rv" data-i="docsH"></h2>
    <div class="docs stg" id="docCards"></div>
  </div>
</section>
</main>

<footer data-pose="sleeping">
  <div class="wrap">
    <img class="nap" data-brand="sleeping" alt="">
    <img class="word" data-brand="wordmark" alt="Sshairy">
    <p data-i="foot"></p>
    <nav><a href="cases.html" data-i="nCases"></a><a data-href="">GitHub</a><a data-href="releases" data-i="rel"></a><a data-href="issues" data-i="issues"></a></nav>
  </div>
</footer>

<button id="buddy" type="button"><img data-brand="default" alt=""></button>

<script src="assets/data.js"></script>
<script src="mock.js"></script>
<script src="charts.js"></script>
<script src="site.js"></script>
</body>
</html>

name: sshairy
description: "Lightweight SSH. Powered by AI."
publish_to: 'none'
version: 0.3.2

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter_svg: ^2.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pinenacl: ^0.6.0
  # Legacy FinalShell password decoding only; new secrets use OS secure storage.
  pointycastle: ^4.0.0
  xterm2: ^5.5.0
  yaml: ^3.1.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Integration tests ask the VM for a full collection before counting what is still alive.
  vm_service: ^15.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/import_sources/
    - assets/mcp_clients/
    - assets/completions/
    - assets/completions/specs/
    - assets/brand/blue/
    - assets/brand/green/
    - assets/brand/violet/
    - assets/brand/orange/
    - assets/brand/deepSea/
    - assets/brand/pink/

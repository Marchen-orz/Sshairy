name: sshairy
description: "Lightweight SSH. Powered by AI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pinenacl: ^0.6.0
  xterm2: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Integration tests ask the VM for a full collection before counting what is still alive.
  vm_service: ^15.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/icon.png
